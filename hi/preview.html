/* ─────────────────────────────────────────────────────────────
   SHARED HOOK: fire once when element scrolls into view
───────────────────────────────────────────────────────────── */
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setInView(true); }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, inView];
}

function useCounter(target, duration = 2200, active = false) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start = null;
    const raf = ts => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 4);
      setVal(Math.round(eased * target));
      if (p < 1) requestAnimationFrame(raf);
    };
    requestAnimationFrame(raf);
  }, [active, target, duration]);
  return val;
}

          opacity: headIn ? 1 : 0, transform: headIn ? "translateY(0)" : "translateY(24px)",
          transition:"opacity .6s ease, transform .6s ease",
        }}>
          <span style={{ color:"#fff" }}>Stop Doing Things </span>
          <span style={{
            background:"linear-gradient(135deg,#F72585,#FF9800)",
            WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", backgroundClip:"text",
          }}>The Hard Way</span>
        </h2>
        <p style={{
          color:"#7A8499", fontSize:18, maxWidth:500, margin:"0 auto", lineHeight:1.7,
          opacity: headIn ? 1 : 0, transform: headIn ? "translateY(0)" : "translateY(20px)",
          transition:"opacity .6s ease .1s, transform .6s ease .1s",
        }}>
          Here's exactly what changes when you switch to a smarter way of working. Hover each row to feel the difference.
        </p>
      </div>

      {/* column labels */}
      <div style={{
        display:"grid", gridTemplateColumns:"1fr 72px 1fr", gap:0,
        maxWidth:900, margin:"0 auto 18px",
      }}>
        <div style={{
          background:"rgba(255,60,60,.1)", border:"1px solid rgba(255,80,80,.3)",
          borderRadius:12, padding:"10px 20px", textAlign:"center",
          color:"#FF6B6B", fontWeight:700, fontSize:12, letterSpacing:2.5, textTransform:"uppercase",
        }}>✕ &nbsp;Before</div>
        <div/>
        <div style={{
          background:"rgba(16,185,129,.1)", border:"1px solid rgba(16,185,129,.3)",
          borderRadius:12, padding:"10px 20px", textAlign:"center",
          color:"#10B981", fontWeight:700, fontSize:12, letterSpacing:2.5, textTransform:"uppercase",
        }}>✓ &nbsp;After</div>
      </div>

      {/* rows */}
      <div style={{ maxWidth:900, margin:"0 auto 80px", display:"flex", flexDirection:"column", gap:12 }}>
        {COMPARISONS.map((c,i) => <CompareRow key={i} c={c} index={i} />)}
      </div>

      {/* CTA */}
      <div style={{ textAlign:"center", position:"relative" }}>
        <p style={{ color:"#6B7280", fontSize:15, marginBottom:28 }}>Join 10,000+ teams already working smarter</p>
        <div style={{ display:"flex", gap:16, justifyContent:"center", flexWrap:"wrap" }}>
          {[
            { label:"Start Free — No Card Needed", bg:"linear-gradient(135deg,#F72585,#FF9800)", color:"#fff", shadow:"rgba(247,37,133,.4)" },
            { label:"Watch a 2-Min Demo",           bg:"transparent",                             color:"#4361EE", shadow:null, outline:"#4361EE" },
          ].map((b,i) => (
            <button key={i} style={{
              background:b.bg, border: b.outline ? `2px solid ${b.outline}` : "none",
              borderRadius:50, padding:"16px 40px",
              fontSize:15.5, fontWeight:700, color:b.color, cursor:"pointer",
              boxShadow: b.shadow ? `0 8px 36px ${b.shadow}` : "none",
              transition:"transform .25s, box-shadow .25s, background .25s",
              letterSpacing:0.2,
            }}
            onMouseEnter={e => {
              e.currentTarget.style.transform = "translateY(-4px)";
              if (b.shadow) e.currentTarget.style.boxShadow = `0 18px 52px ${b.shadow}`;
              if (b.outline) e.currentTarget.style.background = `${b.outline}18`;
            }}
            onMouseLeave={e => {
              e.currentTarget.style.transform = "translateY(0)";
              if (b.shadow) e.currentTarget.style.boxShadow = `0 8px 36px ${b.shadow}`;
              if (b.outline) e.currentTarget.style.background = "transparent";
            }}>
              {b.label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}


/* ─────────────────────────────────────────────────────────────
   ROOT APP
───────────────────────────────────────────────────────────── */
const CONCEPTS = [
  { label:"Concept 1 · Pain Points", component: <Concept1 /> },
  { label:"Concept 2 · Stats + Why Us", component: <Concept2 /> },
  { label:"Concept 3 · Before / After", component: <Concept3 /> },
];

function App() {
  const [active, setActive] = useState(0);
  return (
    <>
      <nav className="tabs">
        {CONCEPTS.map((c,i) => (
          <button key={i} className={`tab ${active === i ? "active" : ""}`} onClick={() => setActive(i)}>
            {c.label}
          </button>
        ))}
      </nav>
      <div key={active}>{CONCEPTS[active].component}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
